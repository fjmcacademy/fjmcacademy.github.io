<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FJMC Academy | Student Login</title>
    <link rel="manifest" href="./manifest.json">

    <link rel="stylesheet" href="student.css">
    <!-- FJMC Academy Logo / Favicon -->
    <link rel="icon" type="image/png" href="image/favicon">
    <link rel="apple-touch-icon" href="image/favicon">
</head>

<body>

<div class="login-page">

    <div class="login-box">

        <div class="logo">FJMC Academy</div>

        <h1>Student Login</h1>

        <p class="login-subtitle">
            Login to access your courses
        </p>

        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">
                LOGIN
            </button>

            <p id="loginMessage"></p>

        </form>

    </div>

</div>

<script type="module" src="firebase.js"></script>
<script type="module" src="login.js"></script>


<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js", { scope: "./" })
      .catch(error => console.error("FJMC PWA service worker error:", error));
  });
}
</script>

</body>
</html>
