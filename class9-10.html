<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Class 9th & 10th Mathematics</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background: #f7f8fc;
            color: #14213d;
        }

        .course-page {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .description {
            color: #555;
            font-size: 17px;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
            color: #e63946;
            margin: 20px 0;
        }

        .videos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .video-card {
            background: #f1f1f1;
            padding: 15px;
            border-radius: 10px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 8px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 30px;
            text-decoration: none;
            color: #e63946;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .videos {
                grid-template-columns: 1fr;
            }

            body {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="course-page">

        <h1>Class 9th & 10th Mathematics</h1>

        <p class="description">
            Complete Mathematics preparation with concepts,
            examples and practice.
        </p>

        <div class="price">
            Course Fee: ₹9,000
        </div>

        <h2>Course Videos</h2>

        <div class="videos">

            <!-- Video 1 -->
            <div class="video-card">
                <h3>Mathematics Lecture 1</h3>

                <div class="video-wrapper">
                    <iframe
                        src="https://www.youtube.com"
                        title="Class 9th & 10th Mathematics Lecture 1"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                    </iframe>
                </div>
            </div>


            <!-- Video 2 -->
            <div class="video-card">
                <h3>Mathematics Lecture 2</h3>

                <div class="video-wrapper">
                    <iframe
                        src="https://www.youtube.com"
                        title="Class 9th & 10th Mathematics Lecture 2"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                    </iframe>
                </div>
            </div>

        </div>

        <a href="index.html" class="back-btn">
            ← Back to Courses
        </a>

    </div>

</body>

</html>
