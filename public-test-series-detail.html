<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FJMC Academy | Test Series</title>
<link rel="stylesheet" href="style.css">
<style>
.page{max-width:1100px;margin:0 auto;padding:110px 20px 60px}
.box{background:#fff;border:1px solid #ddd;border-radius:16px;padding:24px;margin-top:20px}
.exam-title{text-align:center;margin-bottom:8px}.meta{text-align:center;color:#666}
.subject-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin-top:18px}
.subject{border:1px solid #ddd;border-radius:12px;padding:18px;background:#fff;cursor:pointer;transition:.15s}
.subject:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(0,0,0,.08)}
.subject h3{margin:0 0 6px}.tests{margin-top:14px;display:none}.tests.open{display:block}
.test-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #eee;padding:11px 0}
.test-name{font-weight:600}.test-btn,.login{display:inline-block;padding:8px 13px;border-radius:8px;background:#1f6feb;color:#fff;text-decoration:none;border:0;cursor:pointer}
.login{margin-top:20px}.back{display:inline-block;margin-bottom:20px;text-decoration:none}.muted{color:#777;font-size:14px}
</style>
</head>
<body>
<header class="navbar">
  <div class="logo"><span>FJMC</span> Academy</div>
  <nav><a href="index.html">Home</a><a href="public-test-series.html">Test Series</a><a href="login.html">Student Login</a></nav>
</header>
<main class="page">
  <a class="back" href="public-test-series.html">← All Test Series</a>
  <div id="head" class="box">Loading...</div>
  <div id="subjects" class="box"></div>
</main>
<script type="module" src="public-test-series-detail.js"></script>
</body>
</html>
